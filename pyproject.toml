[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_sourccey"
version = "version = "0.2.4.dev1""
description = "Sourccey robot and teleoperator integration for LeRobot"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vulcan Robotics, Inc." }]
keywords = ["lerobot", "robotics", "sourccey", "teleoperation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "lerobot[feetech]>=0.6,<0.7",
    "numpy>=1.24",
    "opencv-python-headless>=4.9",
    "protobuf>=6.31,<7",
    "pynput>=1.7.7",
    "pyzmq>=26,<28",
    "websockets>=15,<17",
]

[project.optional-dependencies]
record = [
    "lerobot[core-scripts]>=0.6,<0.7",
]
dataset = [
    "lerobot[core-scripts]>=0.6,<0.7",
]
hardware = [
    "gpiozero>=2.0.1; sys_platform == 'linux'",
    "lgpio>=0.2.2; sys_platform == 'linux'",
    "smbus2>=0.4.3; sys_platform == 'linux'",
    "adafruit-blinka>=8.52.0; sys_platform == 'linux'",
    "adafruit-circuitpython-lsm6ds>=4.6.1; sys_platform == 'linux'",
    "adafruit-circuitpython-lis3mdl>=1.2.0; sys_platform == 'linux'",
]
dev = [
    "build>=1.2",
    "grpcio-tools>=1.73,<2",
    "pytest>=8",
]
# User-facing installation profiles. Keep the lower-level extras above for
# backward compatibility and compose them here so their dependency lists have
# a single source of truth.
robot = [
    "lerobot-robot-sourccey[hardware]",
]
desktop = [
    "lerobot-robot-sourccey[record,dataset]",
]
all = [
    "lerobot-robot-sourccey[robot,desktop,dev]",
]

[project.scripts]
sourccey-host = "lerobot_robot_sourccey.robots.sourccey.sourccey_host:main"
sourccey-battery = "lerobot_robot_sourccey.battery.battery:main"
sourccey-battery-check = "lerobot_robot_sourccey.battery.check_bq34z100:main"
sourccey-battery-configure = "lerobot_robot_sourccey.battery.configure_bq34z100:main"
sourccey-battery-flash = "lerobot_robot_sourccey.battery.golden.flash_bq34z100:main"
sourccey-dataset-audit-consistency = "lerobot_robot_sourccey.dataset_tools.audit_dataset_consistency:main"
sourccey-dataset-audit-videos = "lerobot_robot_sourccey.dataset_tools.audit_video_decode_errors:main"
sourccey-dataset-combine = "lerobot_robot_sourccey.dataset_tools.combine:main"
sourccey-dataset-fix-consistency = "lerobot_robot_sourccey.dataset_tools.fix_dataset_consistency:main"
sourccey-dataset-remove-feature = "lerobot_robot_sourccey.dataset_tools.remove_feature:main"

[project.urls]
Homepage = "https://github.com/vulcan-forge/lerobot-robot-sourccey"
Documentation = "https://github.com/vulcan-forge/lerobot-robot-sourccey/blob/main/docs/README.md"
Repository = "https://github.com/vulcan-forge/lerobot-robot-sourccey"
Issues = "https://github.com/vulcan-forge/lerobot-robot-sourccey/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lerobot_robot_sourccey*"]

[tool.setuptools.package-data]
lerobot_robot_sourccey = [
    "**/*.json",
    "**/*.proto",
    "**/*.pyi",
    "**/*.urdf",
    "**/*.md",
    "**/*.fs",
    "**/*.srec",
    "**/*.sh",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
